<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Potwierdzanie konta</title>
  <style>
    :root {
      --bg: #101c17;
      --paper: #f4efe1;
      --paper-ink: #241f16;
      --paper-line: #ddd2b3;
      --ink: #eae6d9;
      --gold: #c9a15a;
      --muted: #91a49a;
      --ok: #4d7a5f;
      --err: #a44650;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(ellipse at top, #142720 0%, var(--bg) 55%);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(560px, 100%);
      background: var(--paper);
      border: 1px solid var(--paper-line);
      border-radius: 16px;
      color: var(--paper-ink);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.32);
      padding: 32px 28px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      letter-spacing: -0.03em;
    }

    p {
      margin: 0;
      color: #645a43;
      line-height: 1.6;
      font-size: 1rem;
    }

    .state {
      margin-top: 20px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.74rem;
    }

    .error {
      color: var(--err);
    }

    .success {
      color: var(--ok);
    }

    .icon {
      font-size: 2.3rem;
      line-height: 1;
      margin-bottom: 12px;
      display: block;
    }

    .return-btn {
      display: none;
      margin-top: 22px;
      background: #1a2c26;
      color: #f4efe1;
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .return-btn:hover {
      opacity: 0.92;
    }

    .return-btn.visible {
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">…</div>
    <h1>Potwierdzanie</h1>
    <p id="message">Trwa weryfikacja Twojego linku potwierdzającego…</p>
    <div class="state" id="state">Przetwarzanie</div>
    <a class="return-btn" id="returnButton" href="index.html">Powrót na stronę główną</a>
  </div>

  <script>
    const APP_CONFIG = {
      webAppUrl: 'https://script.google.com/macros/s/AKfycbzV1txpMeQcyGcEbF5NNywsnqxCk59JA8yJrEhbM7CA80MEElOaui9XYGyHddNkhAfTmg/exec'
    };

    const actionMap = {
      register: 'confirmRegister',
      proposal: 'confirmProposal',
      vote: 'confirmVote'
    };

    function setResult(ok, message) {
      const box = document.getElementById('message');
      const state = document.getElementById('state');
      const icon = document.getElementById('icon');
      const returnButton = document.getElementById('returnButton');
      box.textContent = message;
      state.textContent = ok ? 'Potwierdzono' : 'Błąd';
      state.classList.toggle('success', ok);
      state.classList.toggle('error', !ok);
      icon.textContent = ok ? '✓' : '✕';
      icon.style.color = ok ? '#4d7a5f' : '#a44650';
      returnButton.classList.add('visible');
    }

    function confirmAction() {
      const params = new URLSearchParams(window.location.search);
      const type = (params.get('type') || '').toLowerCase();
      const token = params.get('token') || '';
      const returnButton = document.getElementById('returnButton');
      returnButton.classList.remove('visible');

      if (!actionMap[type] || !token) {
        setResult(false, 'Link aktywacyjny jest nieprawidłowy.');
        return;
      }

      const backendUrl = APP_CONFIG.webAppUrl + '?action=' + encodeURIComponent(actionMap[type]) + '&token=' + encodeURIComponent(token) + '&format=json';
      document.getElementById('message').textContent = 'Trwa weryfikacja Twojego linku potwierdzającego…';
      document.getElementById('state').textContent = 'Przetwarzanie';
      document.getElementById('icon').textContent = '…';

      fetch(backendUrl, { method: 'GET', cache: 'no-store' })
        .then(function (response) {
          if (!response.ok) {
            throw new Error('HTTP ' + response.status);
          }
          return response.json();
        })
        .then(function (data) {
          if (data && data.ok) {
            setResult(true, data.message || 'Potwierdzenie zakończyło się powodzeniem.');
            return;
          }
          setResult(false, (data && data.message) || 'Nie udało się potwierdzić konta.');
        })
        .catch(function () {
          setResult(false, 'Nie udało się potwierdzić konta. Spróbuj ponownie później.');
        });
    }

    confirmAction();
  </script>
</body>
</html>
