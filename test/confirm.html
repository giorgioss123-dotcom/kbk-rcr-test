<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Potwierdzanie — KBK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/common.css">
<style>
  :root {
    --teal: #1a5a6b;
    --teal-dark: #13454f;
    --teal-deep: #0c3038;
    --white: #ffffff;
    --paper: #f4eee0;
    --paper-ink: #1a252a;
    --paper-muted: #7a6f4d;
    --paper-line: rgba(12, 48, 56, 0.18);
    --line: rgba(255, 255, 255, 0.18);
    --line-2: rgba(255, 255, 255, 0.32);
    --muted: rgba(255, 255, 255, 0.82);
    --muted-dim: rgba(255, 255, 255, 0.58);
    --pos: #4d7a5f;
    --neg: #a44650;
    --maxw: 1140px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    min-height: 100vh;
    background: var(--teal);
    background-image:
      radial-gradient(ellipse at 15% -10%, rgba(43, 132, 153, 0.38) 0%, transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(12, 48, 56, 0.75) 0%, transparent 60%),
      linear-gradient(180deg, #17505f 0%, #13454f 100%);
    background-attachment: fixed;
    color: var(--white);
    font-family: 'Archivo', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    pointer-events: none; opacity: 0.04; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }
  .nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13, 55, 65, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    max-width: 100vw;
  }
  .nav-inner {
    position: relative;
    max-width: var(--maxw); margin: 0 auto;
    padding: 11px 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    min-width: 0;
  }
  .nav-brand {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: var(--white);
    font-family: 'Anton', sans-serif;
    font-size: 1.02rem; letter-spacing: 0.16em; text-transform: uppercase;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .nav-brand svg {
  width: 18px;
  height: 30px;
  aspect-ratio: 240 / 400;
  color: var(--white);
  display: block;
  flex-shrink: 0;
}

  .wrap {
    position: relative; z-index: 2;
    max-width: 620px; margin: 0 auto;
    padding: 64px 20px 80px;
  }

  .card {
    background: var(--paper);
    color: var(--paper-ink);
    border: 1px solid rgba(0, 0, 0, 0.1);
    box-shadow: 12px 12px 0 rgba(0, 0, 0, 0.35);
    padding: 48px 42px 40px;
    position: relative;
    text-align: center;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--teal-deep);
  }

  .doc-meta {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--paper-muted); margin-bottom: 30px;
  }

  .icon {
    font-family: 'Anton', sans-serif;
    font-size: 3rem; line-height: 1;
    color: var(--teal-deep);
    margin-bottom: 14px;
    display: block;
  }
  .icon.success { color: var(--pos); }
  .icon.error   { color: var(--neg); }

  h1 {
    margin: 0 0 14px;
    font-family: 'Anton', sans-serif; font-weight: 400;
    font-size: clamp(1.8rem, 3.4vw, 2.4rem);
    line-height: 1; letter-spacing: 0.015em;
    text-transform: uppercase; color: var(--teal-deep);
  }

  p {
    margin: 0 auto;
    max-width: 400px;
    color: var(--paper-ink);
    font-size: 0.98rem;
    line-height: 1.65;
  }

  .state {
    margin-top: 28px;
    padding-top: 22px;
    border-top: 1px solid var(--paper-line);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    color: var(--paper-muted);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 0.72rem;
  }
  .state.error   { color: var(--neg); }
  .state.success { color: var(--pos); }

  .return-btn {
    display: none;
    margin-top: 26px;
    padding: 13px 26px;
    background: var(--teal-deep);
    color: var(--paper);
    border: 1px solid var(--teal-deep);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.74rem; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    text-decoration: none;
    transition: background 0.18s, color 0.18s;
  }
  .return-btn:hover { background: transparent; color: var(--teal-deep); }
  .return-btn.visible { display: inline-block; }

  @media (max-width: 560px) {
    .card { padding: 34px 26px 30px; }
    .wrap { padding: 44px 16px 60px; }
  }

  @media (max-width: 480px) {
    .nav-inner { padding: 10px 16px; gap: 10px; }
    .nav-brand { font-size: 0.94rem; letter-spacing: 0.12em; gap: 8px; }
    .nav-brand svg { width: 15px; height: 26px; }
  }

  @media (max-width: 380px) {
    .nav-inner { padding: 10px 12px; }
    .nav-brand { font-size: 0.88rem; letter-spacing: 0.1em; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="kbk-logo" viewBox="0 0 240 400">
      <rect x="111" y="0" width="18" height="400" fill="currentColor"/>
      <circle cx="72" cy="105" r="58" fill="none" stroke="currentColor" stroke-width="14"/>
      <circle cx="168" cy="105" r="58" fill="none" stroke="currentColor" stroke-width="14"/>
      <path d="M 129 248 L 192 248 L 158 272 L 192 296 L 158 320 L 192 344 L 158 368 L 192 392 L 192 400 L 129 400 Z" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">
      <svg viewBox="0 0 240 400"><use href="#kbk-logo"/></svg>
      KBK
    </a>
  </div>
</nav>

<div class="wrap">
  <div class="card">
    <div class="doc-meta">
      <span>Weryfikacja</span>
      <span>System KBK</span>
    </div>
    <span class="icon" id="icon">…</span>
    <h1>Potwierdzanie</h1>
    <p id="message">Trwa weryfikacja Twojego linku potwierdzającego…</p>
    <div class="state" id="state">Przetwarzanie</div>
    <a class="return-btn" id="returnButton" href="index.html">Powrót na stronę główną</a>
  </div>
</div>

<script src="public-config.js"></script>
<script>
  const APP_CONFIG = window.KBK_APP_CONFIG;
  const actionMap = { register: 'confirmRegister', proposal: 'confirmProposal', vote: 'confirmVote' };

  function setResult(ok, message) {
    const box = document.getElementById('message');
    const state = document.getElementById('state');
    const icon = document.getElementById('icon');
    const returnButton = document.getElementById('returnButton');
    box.textContent = message;
    state.textContent = ok ? 'Potwierdzono' : 'Błąd';
    state.classList.toggle('success', ok);
    state.classList.toggle('error', !ok);
    icon.textContent = ok ? '✓' : '✕';
    icon.classList.toggle('success', ok);
    icon.classList.toggle('error', !ok);
    returnButton.classList.add('visible');
  }

  function confirmAction() {
    const params = new URLSearchParams(window.location.search);
    const type = (params.get('type') || '').toLowerCase();
    const token = params.get('token') || '';
    const returnButton = document.getElementById('returnButton');
    returnButton.classList.remove('visible');

    if (!actionMap[type] || !token) { setResult(false, 'Link aktywacyjny jest nieprawidłowy.'); return; }

    const backendUrl = APP_CONFIG.webAppUrl + '?action=' + encodeURIComponent(actionMap[type]) + '&token=' + encodeURIComponent(token) + '&format=json';
    document.getElementById('message').textContent = 'Trwa weryfikacja Twojego linku potwierdzającego…';
    document.getElementById('state').textContent = 'Przetwarzanie';
    document.getElementById('icon').textContent = '…';

    fetch(backendUrl, { method: 'GET', cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        if (data && data.ok) { setResult(true, data.message || 'Potwierdzenie zakończyło się powodzeniem.'); return; }
        setResult(false, (data && data.message) || 'Nie udało się potwierdzić konta.');
      })
      .catch(function () { setResult(false, 'Nie udało się potwierdzić konta. Spróbuj ponownie później.'); });
  }
  confirmAction();
</script>
</body>
</html>
