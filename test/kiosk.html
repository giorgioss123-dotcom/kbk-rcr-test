<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ryneczek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #101c17;
      --bg-alt: #16241e;
      --line: #2a3a33;
      --ink: #eae6d9;
      --ink-muted: #91a49a;
      --gold: #c9a15a;
      --paper: #f4efe1;
      --paper-ink: #241f16;
      --paper-line: #ddd2b3;
      --pos: #4d7a5f;
      --neg: #a44650;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:48px 16px;
      background:radial-gradient(ellipse at top, #142720 0%, var(--bg) 55%);
      color:var(--paper-ink);
      font-family:'Inter',sans-serif;
    }
    main{
      width:min(720px,100%);
      background:var(--paper);
      border:1px solid var(--paper-line);
      border-radius:14px;
      box-shadow:0 28px 70px rgba(0,0,0,0.35);
      padding:28px 26px 32px;
    }
    h1{
      margin:0 0 8px;
      font-family:'Fraunces',serif;
      font-size:32px;
      letter-spacing:-0.02em;
    }
    .subtitle{
      margin:0 0 24px;
      color:#7a6f4d;
      font-size:14px;
    }
    #products{display:grid;gap:12px;}
    .product{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      border:1px solid var(--paper-line);
      border-radius:8px;
      padding:12px 14px;
      background:#fffdf7;
    }
    .product-name{font-weight:600;}
    .product input{
      width:80px;
      border:1px solid var(--paper-line);
      border-radius:6px;
      background:#fffdf7;
      padding:8px 10px;
      font-size:14px;
      color:var(--paper-ink);
    }
    .row{display:grid;gap:8px;margin-top:18px}
    label{display:block;margin:0 0 6px;font-size:13px;font-weight:600;}
    input,button{font:inherit;}
    input[type="text"], input[type="password"]{
      width:100%;
      border:1px solid var(--paper-line);
      border-radius:8px;
      background:#fffdf7;
      padding:10px 12px;
      color:var(--paper-ink);
    }
    input:focus{outline:none;border-color:var(--gold);}
    button{
      width:100%;
      border:none;
      border-radius:8px;
      background:#1b2e26;
      color:#f4efe1;
      padding:12px 16px;
      font-weight:600;
      cursor:pointer;
    }
    .message{
      margin-top:16px;
      min-height:24px;
      font-size:13.5px;
    }
    .error{color:var(--neg);}
    .ok{color:var(--pos);}
  </style>
</head>
<body>
  <main>
    <h1>Ryneczek</h1>
    <p class="subtitle">Wybierz produkty, a zamówienie trafi do zatwierdzenia przez dyżurnego.</p>

    <section id="products">Ładowanie produktów...</section>

    <div class="row">
      <div>
        <label for="login">Login</label>
        <input id="login" autocomplete="username">
      </div>
      <div>
        <label for="pin">PIN</label>
        <input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">
      </div>
      <button id="submit">Wyślij zamówienie</button>
    </div>

    <div id="message" class="message" role="status"></div>
  </main>

  <script>
    const APP_CONFIG = {
      webAppUrl: 'https://script.google.com/macros/s/AKfycbyIhwzMbLmeJ_Z86-z3ZQUv-mERrPYxOjldqWg5zIyarJZP2K_lmKW5XQi0QSxbMvEHYg/exec'
    };
    const productsEl = document.getElementById('products');
    const messageEl = document.getElementById('message');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = 'message ' + (type || '');
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }

    function apiGet(action) {
      return fetch(APP_CONFIG.webAppUrl + '?action=' + encodeURIComponent(action)).then(function (response) {
        return response.json();
      });
    }

    function loadProducts() {
      return apiGet('listProducts').then(function (data) {
        if (!data || !data.ok) throw new Error('Nie udało się pobrać cennika.');
        if (!data.products || data.products.length === 0) {
          productsEl.innerHTML = '<div class="product"><span class="product-name">Brak aktywnych produktów w cenniku.</span></div>';
          return;
        }
        productsEl.innerHTML = data.products.map(function (product, index) {
          return '<div class="product"><span class="product-name">' + escapeHtml(product.name) + ' · ' + product.cost + ' RCR</span><input type="number" min="0" max="100" value="0" data-index="' + index + '" aria-label="Ilość dla produktu ' + escapeHtml(product.name) + '"></div>';
        }).join('');
        productsEl.querySelectorAll('input').forEach(function (input, index) {
          input.dataset.name = data.products[index].name;
        });
      });
    }

    document.getElementById('submit').addEventListener('click', function () {
      var items = Array.from(productsEl.querySelectorAll('input'))
        .map(function (input) {
          return { name: input.dataset.name, quantity: Number(input.value) };
        })
        .filter(function (item) { return item.quantity > 0; });
      var login = document.getElementById('login').value.trim().toLowerCase();
      var pin = document.getElementById('pin').value.trim();

      if (!login || !/^\d{6}$/.test(pin) || items.length === 0) {
        showMessage('Podaj login, 6-cyfrowy PIN i wybierz produkt.', 'error');
        return;
      }

      fetch(APP_CONFIG.webAppUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'claimRewards', login: login, pin: pin, items: items })
      })
        .then(function (response) { return response.json(); })
        .then(function (data) {
          showMessage(data && data.message ? data.message : (data && data.ok ? 'Zamówienie wysłane.' : 'Nie udało się wysłać zamówienia.'), data && data.ok ? 'ok' : 'error');
        })
        .catch(function () {
          showMessage('Nie udało się połączyć z backendem.', 'error');
        });
    });

    loadProducts().catch(function () {
      productsEl.innerHTML = '<div class="product"><span class="product-name">Nie udało się wczytać produktów.</span></div>';
    });
  </script>
</body>
</html>
