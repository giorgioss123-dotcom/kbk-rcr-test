<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ryneczek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #101c17;
      --bg-alt: #16241e;
      --line: #2a3a33;
      --ink: #eae6d9;
      --ink-muted: #91a49a;
      --gold: #c9a15a;
      --paper: #f4efe1;
      --paper-ink: #241f16;
      --paper-line: #ddd2b3;
      --pos: #4d7a5f;
      --neg: #a44650;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:48px 16px;
      background:radial-gradient(ellipse at top, #142720 0%, var(--bg) 55%);
      color:var(--paper-ink);
      font-family:'Inter',sans-serif;
    }
    main{
      width:min(720px,100%);
      background:var(--paper);
      border:1px solid var(--paper-line);
      border-radius:14px;
      box-shadow:0 28px 70px rgba(0,0,0,0.35);
      padding:28px 26px 32px;
    }
    h1{
      margin:0 0 8px;
      font-family:'Fraunces',serif;
      font-size:32px;
      letter-spacing:-0.02em;
    }
    .subtitle{
      margin:0 0 24px;
      color:#7a6f4d;
      font-size:14px;
    }
    #products{display:grid;gap:12px;}
    .product{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      border:1px solid var(--paper-line);
      border-radius:8px;
      padding:12px 14px;
      background:#fffdf7;
    }
    .product-name{font-weight:600;}
    .qty-control{
      display:flex;
      align-items:center;
      gap:8px;
      flex-shrink:0;
      margin-left:auto;
    }
    .qty-button{
      width:40px;
      height:40px;
      border:2px solid var(--paper-line);
      border-radius:8px;
      background:#f7f1d9;
      color:var(--paper-ink);
      font-size:24px;
      line-height:1;
      cursor:pointer;
      padding:0;
      font-weight:700;
      box-shadow:0 1px 0 rgba(36,31,22,0.06);
    }
    .qty-value{
      width:42px;
      min-width:42px;
      max-width:42px;
      height:40px;
      text-align:center;
      border:1px solid var(--paper-line);
      border-radius:6px;
      background:#fffdf7;
      padding:6px 2px;
      font-size:15px;
      line-height:1;
      color:var(--paper-ink);
      font-family:'Inter',sans-serif;
      user-select:none;
      cursor:default;
    }
    .row{display:grid;gap:8px;margin-top:18px}
    label{display:block;margin:0 0 6px;font-size:13px;font-weight:600;}
    input,button{font:inherit;}
    .auth-input,
    input[type="text"],
    input[type="password"],
    input[type="number"]{
      width:100%;
      border:1px solid var(--paper-line);
      border-radius:8px;
      background:#fffdf7;
      padding:10px 12px;
      color:var(--paper-ink);
      appearance:none;
      -webkit-appearance:none;
      box-shadow:none;
    }
    .auth-input,
    input[type="text"],
    input[type="password"]{
      min-height:44px;
    }
    input:focus{outline:none;border-color:var(--gold);}
    .topbar{
      display:flex;
      justify-content:flex-end;
      margin-bottom:18px;
    }
    .home-link{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      border:1px solid var(--paper-line);
      border-radius:8px;
      padding:9px 14px;
      background:transparent;
      color:var(--paper-ink);
      font-size:13px;
      font-weight:600;
    }
    button{
      width:100%;
      border:none;
      border-radius:8px;
      background:#1b2e26;
      color:#f4efe1;
      padding:12px 16px;
      font-weight:600;
      cursor:pointer;
    }
    .status-box{
      margin-top:16px;
      border:1px solid var(--paper-line);
      border-radius:10px;
      background:#fffdf7;
      padding:12px 14px;
      min-height:58px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-size:13.5px;
      line-height:1.4;
      transition:opacity .2s ease, border-color .2s ease, background .2s ease;
    }
    .status-box.hidden{ opacity:0; visibility:hidden; }
    .status-box.error{ border-color:rgba(164,70,80,0.4); background:rgba(164,70,80,0.08); color:var(--neg); }
    .status-box.ok{ border-color:rgba(77,122,95,0.4); background:rgba(77,122,95,0.08); color:var(--pos); }
    .status-box.info{ border-color:rgba(201,161,90,0.4); background:rgba(201,161,90,0.08); color:var(--paper-ink); }

    @media (max-width: 420px) {
      .product {
        align-items:flex-start;
        gap:8px;
      }
      .product-name {
        flex: 1 1 auto;
        min-width: 0;
      }
      .qty-button {
        width:38px;
        height:38px;
        font-size:22px;
      }
      .qty-value {
        width:40px;
        min-width:40px;
        max-width:40px;
        height:38px;
        font-size:14px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <a class="home-link" href="index.html">← strona główna</a>
    </div>
    <h1>Ryneczek</h1>
    <p class="subtitle">Wybierz produkty, a zamówienie trafi do zatwierdzenia przez dyżurnego.</p>

    <section id="products">Ładowanie produktów...</section>

    <div class="row">
      <div>
        <label for="login">Login</label>
        <input id="login" class="auth-input" autocomplete="username">
      </div>
      <div>
        <label for="pin">PIN</label>
        <input id="pin" class="auth-input" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">
      </div>
      <button id="submit">Wyślij zamówienie</button>
    </div>

    <div id="message" class="status-box hidden" role="status" aria-live="polite"></div>
  </main>

  <script>
    const APP_CONFIG = {
      webAppUrl: 'https://script.google.com/macros/s/AKfycbzV1txpMeQcyGcEbF5NNywsnqxCk59JA8yJrEhbM7CA80MEElOaui9XYGyHddNkhAfTmg/exec'
    };
    const PRODUCTS_CACHE_MS = 60 * 1000;
    const MESSAGE_TTL_MS = 4000;
    const productsEl = document.getElementById('products');
    const messageEl = document.getElementById('message');
    const loginInput = document.getElementById('login');
    const pinInput = document.getElementById('pin');

    let messageTimer = null;

    function showMessage(text, type) {
      if (!text) {
        messageEl.textContent = '';
        messageEl.className = 'status-box hidden';
        return;
      }

      messageEl.textContent = text;
      messageEl.className = 'status-box ' + (type || 'info');
      clearTimeout(messageTimer);
      messageTimer = setTimeout(function () {
        showMessage('', 'info');
      }, MESSAGE_TTL_MS);
    }

    function resetOrderForm() {
      loginInput.value = '';
      pinInput.value = '';
      productsEl.querySelectorAll('.qty-value').forEach(function (field) {
        field.value = '0';
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }

    function apiGet(action) {
      return fetch(APP_CONFIG.webAppUrl + '?action=' + encodeURIComponent(action)).then(function (response) {
        return response.json();
      });
    }

    function renderProducts(products) {
      if (!products || products.length === 0) {
        productsEl.innerHTML = '<div class="product"><span class="product-name">Brak aktywnych produktów w cenniku.</span></div>';
        return;
      }

      productsEl.innerHTML = products.map(function (product, index) {
        return '<div class="product"><span class="product-name">' + escapeHtml(product.name) + ' · ' + product.cost + ' RCR</span><div class="qty-control"><button type="button" class="qty-button" data-action="decrement" data-index="' + index + '" aria-label="Zmniejsz ilość produktu ' + escapeHtml(product.name) + '">−</button><input class="qty-value" type="text" value="0" readonly inputmode="numeric" data-index="' + index + '" data-name="' + escapeHtml(product.name) + '" aria-label="Ilość dla produktu ' + escapeHtml(product.name) + '"><button type="button" class="qty-button" data-action="increment" data-index="' + index + '" aria-label="Zwiększ ilość produktu ' + escapeHtml(product.name) + '">+</button></div></div>';
      }).join('');
    }

    function loadProducts() {
      return apiGet('listProducts').then(function (data) {
        if (!data || !data.ok) throw new Error('Nie udało się pobrać cennika.');
        renderProducts(data.products || []);
      });
    }

    function clampQuantity(value) {
      var numeric = Number(value);
      if (!Number.isFinite(numeric)) return 0;
      return Math.min(9, Math.max(0, Math.round(numeric)));
    }

    productsEl.addEventListener('click', function (event) {
      var button = event.target.closest('.qty-button');
      if (!button) return;
      var index = Number(button.dataset.index);
      var input = productsEl.querySelector('.qty-value[data-index="' + index + '"]');
      if (!input) return;
      var current = clampQuantity(input.value);
      var nextValue = button.dataset.action === 'increment' ? current + 1 : current - 1;
      input.value = String(clampQuantity(nextValue));
    });

    document.getElementById('submit').addEventListener('click', function () {
      var items = Array.from(productsEl.querySelectorAll('.qty-value'))
        .map(function (input) {
          return { name: input.dataset.name, quantity: Number(input.value) };
        })
        .filter(function (item) { return item.quantity > 0; });
      var login = loginInput.value.trim().toLowerCase();
      var pin = pinInput.value.trim();

      if (!login || !/^\d{6}$/.test(pin) || items.length === 0) {
        pinInput.value = '';
        showMessage('Podaj login, 6-cyfrowy PIN i wybierz produkt.', 'error');
        return;
      }

      var submitBtn = document.getElementById('submit');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Przetwarzanie…';
      showMessage('Wysyłanie zamówienia…', 'info');

      fetch(APP_CONFIG.webAppUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'claimRewards', login: login, pin: pin, items: items })
      })
        .then(function (response) { return response.json(); })
        .then(function (data) {
          pinInput.value = '';
          if (data && data.ok) {
            resetOrderForm();
          }
          showMessage(data && data.message ? data.message : (data && data.ok ? 'Zamówienie wysłane.' : 'Nie udało się wysłać zamówienia.'), data && data.ok ? 'ok' : 'error');
        })
        .catch(function () {
          pinInput.value = '';
          showMessage('Nie udało się połączyć z backendem.', 'error');
        })
        .finally(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Wyślij zamówienie';
        });
    });

    loadProducts().catch(function () {
      productsEl.innerHTML = '<div class="product"><span class="product-name">Nie udało się wczytać produktów.</span></div>';
    });
  </script>
</body>
</html>
