<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCR — bilans społeczności · KBK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #1a5a6b; --teal-dark: #13454f; --teal-deep: #0c3038;
    --white: #ffffff; --paper: #f4eee0; --paper-ink: #1a252a; --paper-muted: #7a6f4d;
    --paper-line: rgba(12, 48, 56, 0.18);
    --line: rgba(255, 255, 255, 0.18); --line-2: rgba(255, 255, 255, 0.32);
    --muted: rgba(255, 255, 255, 0.82); --muted-dim: rgba(255, 255, 255, 0.58);
    --gold: #d4a95f; --gold-soft: rgba(212, 169, 95, 0.15);
    --pos: #7cc08e; --pos-dk: #4d7a5f; --pos-bg: rgba(124, 192, 142, 0.14);
    --neg: #d1687a; --neg-dk: #a44650; --neg-bg: rgba(209, 104, 122, 0.14);
    --maxw: 1140px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    background: var(--teal);
    background-image:
      radial-gradient(ellipse at 15% -10%, rgba(43, 132, 153, 0.38) 0%, transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(12, 48, 56, 0.75) 0%, transparent 60%),
      linear-gradient(180deg, #17505f 0%, #13454f 100%);
    background-attachment: fixed;
    color: var(--white);
    font-family: 'Archivo', system-ui, -apple-system, sans-serif;
    font-size: 16.5px; line-height: 1.62;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    pointer-events: none; opacity: 0.04; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }

  /* NAV */
  .nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13, 55, 65, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    max-width: 100vw;
  }
  .nav-inner {
    position: relative;
    max-width: var(--maxw); margin: 0 auto;
    padding: 11px 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    min-width: 0;
  }
  .nav-brand {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: var(--white);
    font-family: 'Anton', sans-serif;
    font-size: 1.02rem; letter-spacing: 0.16em; text-transform: uppercase;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .nav-brand svg {
  width: 18px;
  height: 30px;
  aspect-ratio: 240 / 400;
  color: var(--white);
  display: block;
  flex-shrink: 0;
}
  .nav-back {
    color: var(--muted); text-decoration: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 8px 14px; border: 1px solid var(--line-2);
    transition: background 0.18s, color 0.18s;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .nav-back:hover { background: var(--white); color: var(--teal-deep); }

  .wrap {
    position: relative; z-index: 2;
    max-width: 900px; margin: 0 auto;
    padding: 56px 24px 120px;
  }

  header {
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 24px; flex-wrap: wrap;
    padding-bottom: 24px; margin-bottom: 30px;
    border-bottom: 2px solid var(--white);
  }
  .section-num {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem; letter-spacing: 0.18em;
    color: var(--muted-dim); margin-bottom: 10px;
  }
  .title-block h1 {
    font-family: 'Anton', sans-serif; font-weight: 400;
    font-size: clamp(1.9rem, 3.6vw, 2.8rem);
    line-height: 1; margin: 0 0 8px;
    letter-spacing: 0.015em; text-transform: uppercase;
    color: var(--white);
  }
  .title-block p {
    margin: 0; color: var(--muted);
    font-size: 0.92rem; max-width: 46ch;
  }
  .stat { text-align: right; }
  .stat .num {
    font-family: 'Anton', sans-serif;
    font-size: clamp(1.7rem, 3vw, 2.2rem);
    color: var(--white); line-height: 1;
    text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.3);
  }
  .stat .lbl {
    color: var(--muted-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem; letter-spacing: 0.14em;
    text-transform: uppercase; margin-top: 8px;
  }

  .toolbar {
    display: flex; gap: 12px; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .search {
    flex: 1; min-width: 200px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line-2);
    border-radius: 0;
    padding: 12px 14px;
    color: var(--white);
    font-family: 'Archivo', sans-serif; font-size: 14px;
  }
  .search::placeholder { color: var(--muted-dim); }
  .search:focus { outline: none; border-color: var(--white); }

  .toggle-row {
    display: flex; align-items: center; gap: 10px;
    color: var(--muted-dim); font-size: 0.72rem;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.1em; text-transform: uppercase;
    white-space: nowrap;
  }
  .toggle-row input { accent-color: var(--white); }

  .sync {
    display: flex; align-items: center; gap: 10px;
    color: var(--muted-dim); font-size: 0.72rem;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .sync .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--pos);
    box-shadow: 0 0 0 3px var(--pos-bg);
  }

  .list { border-top: 1px solid var(--line); }
  .row {
    display: grid;
    grid-template-columns: 44px 1fr 140px 90px;
    align-items: center; gap: 16px;
    padding: 15px 8px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    background: transparent;
    transition: background 0.12s ease;
  }
  .row:hover { background: rgba(255, 255, 255, 0.05); }
  .row:focus-visible { outline: 2px solid var(--white); outline-offset: -2px; }

  .rank {
    font-family: 'Anton', sans-serif;
    color: var(--muted-dim);
    font-size: 1.15rem; letter-spacing: 0.05em;
    text-align: center;
  }
  .row:nth-child(1) .rank,
  .rank.top { color: var(--gold); }

  .who .login-line {
    display: flex; align-items: center;
    gap: 10px; flex-wrap: wrap;
    min-width: 0;
  }
  .who .login {
    font-size: 1rem;
    font-weight: 600;
    color: var(--white);
    letter-spacing: 0.005em;
    word-break: break-word;
  }
  .state-tag {
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.62rem; padding: 3px 9px;
    border: 1px solid transparent;
    white-space: nowrap;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .state-tag.inactive {
    background: var(--neg-bg); color: var(--neg);
    border-color: rgba(209, 104, 122, 0.35);
  }
  .who .bar-track {
    margin-top: 8px;
    height: 4px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  .who .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #6f8f7f, var(--gold));
  }
  .rcr {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.96rem; font-weight: 500;
    text-align: right; color: var(--white);
    white-space: nowrap;
  }
  .pct {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
    color: var(--muted-dim);
    text-align: right;
    white-space: nowrap;
  }
  .empty, .error {
    padding: 44px 8px;
    color: var(--muted-dim);
    text-align: center; font-size: 0.88rem;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.1em; text-transform: uppercase;
    line-height: 1.7;
  }
  .error { color: var(--neg); }
  .error button {
    display: inline-block; margin-top: 16px;
    background: transparent;
    border: 1px solid var(--neg);
    color: var(--neg);
    padding: 10px 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase;
    cursor: pointer;
    transition: background 0.18s, color 0.18s;
  }
  .error button:hover { background: var(--neg); color: var(--white); }

  .skeleton .row { cursor: default; }
  .skel-bar {
    height: 12px;
    background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

  /* DRAWER */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(6, 10, 8, 0.6);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 20;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: min(1220px, 96vw);
    background: var(--paper); color: var(--paper-ink);
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(.2, .8, .2, 1);
    z-index: 21;
    display: flex; flex-direction: column;
    box-shadow: -20px 0 40px rgba(0, 0, 0, 0.45);
  }
  .drawer.open { transform: translateX(0); }

  .drawer-head {
    padding: 30px 34px 22px;
    border-bottom: 1px solid var(--paper-line);
    position: relative;
  }
  .drawer-head::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--teal-deep);
  }
  .drawer-head .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--paper-muted);
  }
  .drawer-head h2 {
    font-family: 'Anton', sans-serif; font-weight: 400;
    font-size: clamp(1.7rem, 3vw, 2.3rem);
    margin: 8px 0 18px;
    text-transform: uppercase; letter-spacing: 0.015em;
    line-height: 1.05; color: var(--teal-deep);
    word-break: break-word;
  }
  .drawer-head .summary {
    display: flex; gap: 32px; flex-wrap: wrap;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.88rem;
  }
  .drawer-head .summary > div span {
    display: block; color: var(--paper-muted);
    font-size: 0.66rem; letter-spacing: 0.16em;
    text-transform: uppercase; margin-bottom: 5px;
  }
  .drawer-head .summary > div strong {
    font-family: 'Anton', sans-serif;
    font-weight: 400; font-size: 1.15rem;
    letter-spacing: 0.04em; color: var(--teal-deep);
  }
  .drawer-close {
    position: absolute; top: 22px; right: 24px;
    background: transparent; border: none;
    font-size: 1.1rem; color: var(--paper-muted);
    cursor: pointer; line-height: 1;
    font-family: 'Anton', sans-serif;
    padding: 8px;
    transition: color 0.15s;
  }
  .drawer-close:hover { color: var(--teal-deep); }

  .drawer-body {
    display: flex; flex: 1; min-height: 0;
  }
  .drawer-col-left {
    flex: 1.15; min-width: 0;
    padding: 26px 30px 32px;
    overflow-y: auto;
    border-right: 1px solid var(--paper-line);
  }
  .drawer-col-right {
    flex: 1; min-width: 0;
    padding: 26px 30px 32px;
    overflow-y: auto;
  }

  .tx {
    padding: 16px 0;
    border-bottom: 1px dashed var(--paper-line);
  }
  .tx:last-child { border-bottom: none; }
  .tx-top {
    display: flex; justify-content: space-between;
    align-items: baseline; gap: 12px;
  }
  .tx-title {
    font-size: 0.98rem; font-weight: 600;
    color: var(--paper-ink);
    word-break: break-word;
  }
  .tx-amount {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.96rem; font-weight: 500;
    white-space: nowrap;
  }
  .tx-amount.pos { color: var(--pos-dk); }
  .tx-amount.neg { color: var(--neg-dk); }
  .tx-meta {
    display: flex; gap: 10px; align-items: center;
    margin-top: 6px;
    font-size: 0.72rem;
    color: var(--paper-muted);
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .tx-empty {
    color: var(--paper-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    padding: 30px 0;
  }

  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--paper-muted);
    margin: 26px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--paper-line);
  }
  .section-label:first-child { margin-top: 0; }

  .chart-title {
    font-family: 'Anton', sans-serif; font-weight: 400;
    font-size: clamp(1.4rem, 2.6vw, 1.8rem);
    margin: 0 0 6px; letter-spacing: 0.015em;
    text-transform: uppercase; color: var(--teal-deep);
  }
  .chart-subtitle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--paper-muted);
    margin: 0 0 16px;
  }
  .chart-wrap {
    background: rgba(255, 255, 255, 0.4);
    border: 1px solid var(--paper-line);
    padding: 14px 14px 6px;
  }
  .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-empty {
    color: var(--paper-muted); font-size: 0.82rem;
    padding: 20px 4px;
    background: rgba(255, 255, 255, 0.4);
    border: 1px solid var(--paper-line);
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.08em; text-transform: uppercase;
  }

  .cat-list {
    border: 1px solid var(--paper-line);
    overflow: hidden;
  }
  .cat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px;
    font-size: 0.88rem;
    border-bottom: 1px solid var(--paper-line);
    background: rgba(255, 255, 255, 0.3);
    gap: 12px;
  }
  .cat-row:last-child { border-bottom: none; }
  .cat-title {
    text-transform: capitalize;
    color: var(--paper-ink);
    word-break: break-word;
    min-width: 0;
  }
  .cat-sum {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.88rem; font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .cat-sum.pos { color: var(--pos-dk); }
  .cat-sum.neg { color: var(--neg-dk); }

  @media (max-width: 760px) {
    .drawer-body { flex-direction: column; overflow-y: auto; }
    .drawer-col-left {
      border-right: none;
      border-bottom: 1px solid var(--paper-line);
      overflow-y: visible;
    }
    .drawer-col-right { overflow-y: visible; }
  }

  @media (max-width: 560px) {
    .row { grid-template-columns: 34px 1fr 96px; gap: 12px; }
    .pct { display: none; }
    header { align-items: flex-start; }
    .stat { text-align: left; }
    .wrap { padding: 36px 16px 80px; }
    .drawer-head { padding: 24px 22px 18px; }
    .drawer-col-left, .drawer-col-right { padding: 20px 22px 24px; }
  }

  @media (max-width: 480px) {
    .row { grid-template-columns: 28px 1fr 88px; gap: 10px; }
    .rcr { font-size: 0.88rem; }
    .rank { font-size: 1rem; }
    .who .login { font-size: 0.94rem; }

    .nav-inner { padding: 10px 16px; gap: 10px; }
    .nav-brand { font-size: 0.94rem; letter-spacing: 0.12em; gap: 8px; }
    .nav-brand svg { width: 15px; height: 26px; }
    .nav-back {
      padding: 7px 11px;
      font-size: 0.64rem;
      letter-spacing: 0.12em;
    }
  }

  @media (max-width: 380px) {
    .nav-inner { padding: 10px 12px; gap: 8px; }
    .nav-back { padding: 6px 9px; font-size: 0.6rem; }
    .nav-brand { font-size: 0.88rem; letter-spacing: 0.1em; }
    .row { grid-template-columns: 24px 1fr 78px; gap: 8px; }
  }
</style>
</head>

<div class="wrap">
  <header>
    <div class="title-block">
      <span class="section-num">Moduł / 04</span>
      <h1>RCR — bilans</h1>
      <p>Ranking posiadaczy RCR i siły głosu. Kliknij w osobę, żeby zobaczyć jej transakcje.</p>

      <div class="num" id="totalRcr">—</div>

      <div id="txListArea"></div>

<script>
  const shared = window.KBKShared;
  const PUBLIC_SHEET_IDS = window.KBK_PUBLIC_SHEET_IDS;
  const SHEET_ID = PUBLIC_SHEET_IDS.transakcjeFileId;
  const ARCHIVE_SHEET_ID = PUBLIC_SHEET_IDS.transakcjeArchiveFileId;
  const ARCHIVE_SHEET_NAME = 'RCR';
  const REFRESH_MS = 5 * 60 * 1000;
  const JSONP_TIMEOUT_MS = 15000;

  let saldaRows = [];
  let rcrRows = [];
  let archiveRows = [];
  let archiveLoaded = false;
  let refreshTimer = null;
  let showInactive = false;

  function parseNum(v){
    if (v === undefined || v === null) return 0;
    const cleaned = String(v).replace('%','').replace(/\s/g,'').replace(',', '.');
    const n = parseFloat(cleaned);
    return isNaN(n) ? 0 : n;
  }

  function loadSheetJSONP(sheetId, sheetName){
    return shared.loadSheetJSONP(sheetId, sheetName, { cacheMs: 5 * 60 * 1000, timeoutMs: JSONP_TIMEOUT_MS });
  }

  function tableToObjects(table){
    return shared.tableToObjects(table);
  }
  function strFromCell(cell){
    return shared.strFromCell(cell);
  }
  function numFromCell(cell){
    return shared.numFromCell(cell);
  }
  function pctFromCell(cell){
    if (!cell) return 0;
    if (typeof cell.f === 'string' && cell.f.includes('%')) return parseNum(cell.f);
    if (typeof cell.v === 'number') return cell.v <= 1 ? cell.v * 100 : cell.v;
    return 0;
  }
  function parseDateSort(str){
    if (!str) return 0;
    const parts = String(str).split('/');
    if (parts.length === 3) {
      const m = parseInt(parts[0], 10), d = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
      if (!isNaN(m) && !isNaN(d) && !isNaN(y)) return new Date(y, m - 1, d).getTime();
    }
    const t = Date.parse(str);
    return isNaN(t) ? 0 : t;
  }

  async function loadArchiveOnce(){
    try{
      const table = await loadSheetJSONP(ARCHIVE_SHEET_ID, ARCHIVE_SHEET_NAME);
      const objs = tableToObjects(table);
      archiveRows = objs
        .map(o => ({
          login: strFromCell(o['Login']).trim(),
          rcr: numFromCell(o['RCR']),
          tytul: strFromCell(o['Tytuł']) || strFromCell(o['Opis']) || '(bez tytułu)',
          data: strFromCell(o['Data']),
          source: 'archiwum'
        }))
        .filter(r => r.login !== '');
    }catch(err){
      console.error('Nie udało się wczytać archiwum:', err);
      archiveRows = [];
    }
    archiveLoaded = true;
  }

  async function loadAll(isManual){
    setSyncState('loading', isManual ? 'odświeżanie…' : 'wczytywanie…');
    try{
      const [saldaTable, rcrTable] = await Promise.all([
        loadSheetJSONP(SHEET_ID, 'SALDA'),
        loadSheetJSONP(SHEET_ID, 'RCR')
      ]);
      const saldaObjs = tableToObjects(saldaTable);
      const rcrObjs = tableToObjects(rcrTable);

      saldaRows = saldaObjs
        .map(o => {
          const active = String(strFromCell(o['AKTYWNY'])).trim().toLowerCase() === 'tak';
          return {
            login: strFromCell(o['Login']).trim(),
            rcr: numFromCell(o['RCR']),
            rcrt: numFromCell(o['RCRT']),
            pctTotal: pctFromCell(o['PROCENT RCR']),
            pctActive: pctFromCell(o['PROCENT AKTYWNYCH RCR']),
            aktywny: active
          };
        })
        .filter(r => r.login !== '')
        .sort((a,b) => b.rcr - a.rcr);

      rcrRows = rcrObjs
        .map(o => ({
          login: strFromCell(o['Login']).trim(),
          rcr: numFromCell(o['RCR']),
          tytul: strFromCell(o['Tytuł']) || '(bez tytułu)',
          operacja: strFromCell(o['Operacja']),
          data: strFromCell(o['Data']),
          source: 'bieżące'
        }))
        .filter(r => r.login !== '');

      if (saldaRows.length === 0) {
        throw new Error('Arkusz SALDA nie zwrócił żadnych wierszy — sprawdź nazwę zakładki i nagłówki kolumn');
      }
      renderList();
      setSyncState('ok', 'zsynchronizowano ' + new Date().toLocaleTimeString('pl-PL'));
    }catch(err){
      console.error(err);
      setSyncState('error', 'błąd połączenia');
      renderError(err && err.message ? err.message : null);
    }
  }

  function setSyncState(state, label){
    const dot = document.getElementById('syncDot');
    const lbl = document.getElementById('syncLabel');
    lbl.textContent = label;
    if(state === 'ok'){
      dot.style.background = 'var(--pos)';
      dot.style.boxShadow = '0 0 0 3px var(--pos-bg)';
    } else if(state === 'error'){
      dot.style.background = 'var(--neg)';
      dot.style.boxShadow = '0 0 0 3px var(--neg-bg)';
    } else {
      dot.style.background = 'var(--gold)';
      dot.style.boxShadow = '0 0 0 3px var(--gold-soft)';
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderError(detail){
    document.getElementById('listContainer').innerHTML = `
      <div class="error">
        Nie udało się pobrać danych z arkusza.<br>
        Upewnij się, że arkusz jest udostępniony jako „każdy z linkiem może wyświetlać”.
        ${detail ? `<div style="margin-top:10px;font-size:11px;opacity:0.8;">${escapeHtml(detail)}</div>` : ''}
        <div><button id="retryBtn">Spróbuj ponownie</button></div>
      </div>`;
    document.getElementById('retryBtn').addEventListener('click', () => loadAll(true));
  }

  function renderList(filter){
    const q = (filter || document.getElementById('searchInput').value || '').toLowerCase().trim();
    const rows = saldaRows.filter(r => (showInactive || r.aktywny) && r.login.toLowerCase().includes(q));
    const total = rows.reduce((s, r) => s + r.rcr, 0);
    const label = showInactive ? 'uczestników' : 'aktywnych';

    document.getElementById('totalRcr').textContent = Math.round(total).toLocaleString('pl-PL');
    document.getElementById('totalUsers').textContent = rows.length + ' ' + label;

    const maxRcr = rows.length ? Math.max(...rows.map(r => r.rcr), 1) : 1;
    const container = document.getElementById('listContainer');
    if(rows.length === 0){
      container.innerHTML = '<div class="empty">Brak wyników dla podanego loginu.</div>';
      return;
    }

    container.innerHTML = rows.map((r, i) => {
      const width = maxRcr > 0 ? Math.max(2, (r.rcr / maxRcr) * 100) : 0;
      const displayPct = showInactive ? (r.pctTotal || 0) : (r.aktywny ? (r.pctActive || 0) : (r.pctTotal || 0));
      const stateTag = r.aktywny ? '' : '<span class="state-tag inactive">nieaktywny</span>';
      return `
      <div class="row" tabindex="0" role="button" data-login="${escapeHtml(r.login)}" aria-label="Zobacz transakcje: ${escapeHtml(r.login)}">
        <div class="rank ${i===0 ? 'top' : ''}">${i+1}</div>
        <div class="who">
          <div class="login-line">
            <span class="login">${escapeHtml(r.login)}</span>
            ${stateTag}
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div>
        </div>
        <div class="rcr">${Math.round(r.rcr).toLocaleString('pl-PL')} RCR</div>
        <div class="pct">${(displayPct || 0).toFixed(2)}%</div>
      </div>`;
    }).join('');

    container.querySelectorAll('.row').forEach(el => {
      el.addEventListener('click', () => openDrawer(el.dataset.login));
      el.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openDrawer(el.dataset.login); } });
    });
  }

  function formatThousands(v){
    const abs = Math.abs(v);
    if (abs >= 1000) {
      const val = Math.round((v / 1000) * 10) / 10;
      return String(val).replace('.', ',') + ' tys.';
    }
    return String(Math.round(v));
  }
  function formatDateShort(ts){
    const d = new Date(ts);
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yy = String(d.getFullYear()).slice(-2);
    return mm + '/' + yy;
  }

  function monotonePathD(pts){
    const n = pts.length;
    if (n < 2) return '';
    if (n === 2){
      return `M ${pts[0].x.toFixed(2)},${pts[0].y.toFixed(2)} L ${pts[1].x.toFixed(2)},${pts[1].y.toFixed(2)}`;
    }
    const dx = new Array(n - 1), dy = new Array(n - 1), m = new Array(n - 1);
    for (let i = 0; i < n - 1; i++){
      dx[i] = pts[i + 1].x - pts[i].x;
      dy[i] = pts[i + 1].y - pts[i].y;
      m[i] = dx[i] === 0 ? 0 : dy[i] / dx[i];
    }
    const t = new Array(n);
    t[0] = m[0];
    t[n - 1] = m[n - 2];
    for (let i = 1; i < n - 1; i++){
      t[i] = (m[i - 1] * m[i] <= 0) ? 0 : (m[i - 1] + m[i]) / 2;
    }
    for (let i = 0; i < n - 1; i++){
      if (m[i] === 0){ t[i] = 0; t[i + 1] = 0; continue; }
      const a = t[i] / m[i];
      const b = t[i + 1] / m[i];
      if (a < 0) t[i] = 0;
      if (b < 0) t[i + 1] = 0;
      const a2 = t[i] / m[i], b2 = t[i + 1] / m[i];
      const h = a2 * a2 + b2 * b2;
      if (h > 9){
        const scale = 3 / Math.sqrt(h);
        t[i] = scale * a2 * m[i];
        t[i + 1] = scale * b2 * m[i];
      }
    }
    let d = `M ${pts[0].x.toFixed(2)},${pts[0].y.toFixed(2)}`;
    for (let i = 0; i < n - 1; i++){
      const p0 = pts[i], p1 = pts[i + 1];
      const cp1x = p0.x + dx[i] / 3;
      const cp1y = p0.y + t[i] * dx[i] / 3;
      const cp2x = p1.x - dx[i] / 3;
      const cp2y = p1.y - t[i + 1] * dx[i] / 3;
      d += ` C ${cp1x.toFixed(2)},${cp1y.toFixed(2)} ${cp2x.toFixed(2)},${cp2y.toFixed(2)} ${p1.x.toFixed(2)},${p1.y.toFixed(2)}`;
    }
    return d;
  }

  function buildBalanceChartSvg(txsAsc){
    if (txsAsc.length < 2) return '';
    let running = 0;
    const rawPoints = txsAsc.map(t => {
      running += t.rcr;
      return { x: parseDateSort(t.data), y: running };
    });
    const byX = new Map();
    rawPoints.forEach(p => byX.set(p.x, p.y));
    const points = Array.from(byX.entries())
      .map(([x, y]) => ({ x: Number(x), y }))
      .sort((a, b) => a.x - b.x);
    if (points.length < 2) return '';

    const W = 760, H = 260;
    const padL = 54, padR = 14, padT = 14, padB = 26;
    const xs = points.map(p => p.x), ys = points.map(p => p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const rawMinY = Math.min(...ys), rawMaxY = Math.max(...ys);
    const minY = Math.min(0, rawMinY);
    const maxY = Math.max(rawMaxY, minY + 1);
    const spanX = Math.max(maxX - minX, 1);
    const spanY = Math.max(maxY - minY, 1);
    const innerW = W - padL - padR, innerH = H - padT - padB;

    const xScale = x => padL + ((x - minX) / spanX) * innerW;
    const yScale = y => padT + innerH - ((y - minY) / spanY) * innerH;
    const scaled = points.map(p => ({ x: xScale(p.x), y: yScale(p.y) }));
    const lineD = monotonePathD(scaled);
    const baseline = yScale(minY).toFixed(2);
    const areaD = `${lineD} L ${scaled[scaled.length - 1].x.toFixed(2)},${baseline} L ${scaled[0].x.toFixed(2)},${baseline} Z`;
    const gradId = 'chartGrad_' + Math.random().toString(36).slice(2, 9);

    const gridLines = [0, 0.25, 0.5, 0.75, 1].map(f => {
      const val = minY + f * spanY;
      const y = yScale(val);
      return `
        <line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="rgba(12,48,56,0.18)" stroke-width="1"/>
        <text x="${padL - 8}" y="${y.toFixed(1)}" font-size="10.5" font-family="'IBM Plex Mono',monospace" fill="#9a8d63" text-anchor="end" dominant-baseline="middle">${formatThousands(val)}</text>`;
    }).join('');

    const xTicks = [0, 0.25, 0.5, 0.75, 1].map(f => minX + f * spanX);
    const xLabels = xTicks.map((x, i) => {
      const anchor = i === 0 ? 'start' : (i === xTicks.length - 1 ? 'end' : 'middle');
      return `<text x="${xScale(x).toFixed(1)}" y="${H - 6}" font-size="10.5" font-family="'IBM Plex Mono',monospace" fill="#9a8d63" text-anchor="${anchor}">${formatDateShort(x)}</text>`;
    }).join('');

    return `
    <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#a44650" stop-opacity="0.38"/>
          <stop offset="100%" stop-color="#a44650" stop-opacity="0.02"/>
        </linearGradient>
      </defs>
      ${gridLines}
      <path d="${areaD}" fill="url(#${gradId})" stroke="none"/>
      <path d="${lineD}" fill="none" stroke="#a44650" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
      ${xLabels}
    </svg>`;
  }

  function buildCategorySummary(txs){
    const map = new Map();
    txs.forEach(t => {
      const key = t.tytul || '(bez tytułu)';
      map.set(key, (map.get(key) || 0) + t.rcr);
    });
    return Array.from(map.entries())
      .map(([tytul, sum]) => ({ tytul, sum }))
      .sort((a, b) => Math.abs(b.sum) - Math.abs(a.sum));
  }

  function openDrawer(login){
    const user = saldaRows.find(r => r.login === login);
    const txs = [...rcrRows, ...archiveRows]
      .filter(r => r.login === login)
      .sort((a, b) => parseDateSort(b.data) - parseDateSort(a.data));
    const txsAsc = [...txs].reverse();

    const drawerPct = user
      ? (showInactive ? (user.pctTotal || 0) : (user.aktywny ? (user.pctActive || 0) : (user.pctTotal || 0)))
      : 0;

    document.getElementById('drawerLogin').textContent = login;
    document.getElementById('drawerBalance').textContent = user ? Math.round(user.rcr).toLocaleString('pl-PL') : '—';
    document.getElementById('drawerPower').textContent = user ? drawerPct.toFixed(2) + '%' : '—';
    document.getElementById('drawerCount').textContent = txs.length;
    document.getElementById('drawerEyebrow').textContent = 'transakcje';

    const chartCatArea = document.getElementById('chartCatArea');
    const txListArea = document.getElementById('txListArea');

    if (txs.length === 0){
      chartCatArea.innerHTML = '';
      txListArea.innerHTML = archiveLoaded
        ? '<div class="tx-empty">Brak zarejestrowanych transakcji.</div>'
        : '<div class="tx-empty">Wczytywanie transakcji archiwalnych…</div>';
    } else {
      const chartSvg = buildBalanceChartSvg(txsAsc);
      const chartBlock = `
        <div class="chart-title">Bilans</div>
        <div class="chart-subtitle">Historia transakcji</div>
        ${chartSvg
          ? `<div class="chart-wrap">${chartSvg}</div>`
          : `<div class="chart-empty">Za mało danych, by pokazać wykres.</div>`}`;

      const categories = buildCategorySummary(txs);
      const catBlock = `
        <div class="section-label">Podsumowanie wg tytułu</div>
        <div class="cat-list">
          ${categories.map(c => {
            const pos = c.sum >= 0;
            return `
            <div class="cat-row">
              <span class="cat-title">${escapeHtml(c.tytul)}</span>
              <span class="cat-sum ${pos ? 'pos' : 'neg'}">${pos ? '+' : ''}${Math.round(c.sum).toLocaleString('pl-PL')}</span>
            </div>`;
          }).join('')}
        </div>`;
      chartCatArea.innerHTML = chartBlock + catBlock;

      txListArea.innerHTML = txs.map(t => {
        const pos = t.rcr >= 0;
        return `
        <div class="tx">
          <div class="tx-top">
            <div class="tx-title">${escapeHtml(t.tytul)}</div>
            <div class="tx-amount ${pos ? 'pos' : 'neg'}">${pos ? '+' : ''}${Math.round(t.rcr).toLocaleString('pl-PL')}</div>
          </div>
          <div class="tx-meta">
            <span>${escapeHtml(t.data)}</span>
          </div>
        </div>`;
      }).join('');
    }

    document.getElementById('drawer').classList.add('open');
    document.getElementById('drawer').setAttribute('aria-hidden', 'false');
    document.getElementById('scrim').classList.add('open');
    document.getElementById('drawerClose').focus();
  }

  function closeDrawer(){
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawer').setAttribute('aria-hidden', 'true');
    document.getElementById('scrim').classList.remove('open');
  }

  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.getElementById('scrim').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDrawer(); });
  document.getElementById('searchInput').addEventListener('input', e => renderList(e.target.value));
  document.getElementById('showInactiveToggle').addEventListener('change', function () {
    showInactive = this.checked;
    renderList();
  });

  loadArchiveOnce();
  loadAll(false);
  refreshTimer = setInterval(() => loadAll(false), REFRESH_MS);
</script>
</body>
