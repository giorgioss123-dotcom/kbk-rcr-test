<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wnioski — KBK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #1a5a6b; --teal-dark: #13454f; --teal-deep: #0c3038;
    --white: #ffffff; --paper: #f4eee0; --paper-ink: #1a252a; --paper-muted: #7a6f4d;
    --paper-line: rgba(12, 48, 56, 0.18);
    --line: rgba(255, 255, 255, 0.18); --line-2: rgba(255, 255, 255, 0.32);
    --muted: rgba(255, 255, 255, 0.82); --muted-dim: rgba(255, 255, 255, 0.58);
    --gold: #d4a95f;
    --pos: #7cc08e; --pos-dk: #4d7a5f; --pos-bg: rgba(124, 192, 142, 0.14);
    --neg: #d1687a; --neg-dk: #a44650; --neg-bg: rgba(209, 104, 122, 0.14);
    --maxw: 1140px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    min-height: 100vh;
    background: var(--teal);
    background-image:
      radial-gradient(ellipse at 15% -10%, rgba(43, 132, 153, 0.38) 0%, transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(12, 48, 56, 0.75) 0%, transparent 60%),
      linear-gradient(180deg, #17505f 0%, #13454f 100%);
    background-attachment: fixed;
    color: var(--white);
    font-family: 'Archivo', system-ui, -apple-system, sans-serif;
    font-size: 16.5px; line-height: 1.62;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    pointer-events: none; opacity: 0.04; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }

  /* NAV */
  .nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13, 55, 65, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    max-width: 100vw;
  }
  .nav-inner {
    position: relative;
    max-width: var(--maxw); margin: 0 auto;
    padding: 11px 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    min-width: 0;
  }
  .nav-brand {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: var(--white);
    font-family: 'Anton', sans-serif;
    font-size: 1.02rem; letter-spacing: 0.16em; text-transform: uppercase;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .nav-brand svg {
  width: 18px;
  height: 30px;
  aspect-ratio: 240 / 400;
  color: var(--white);
  display: block;
  flex-shrink: 0;
}
  .nav-back {
    color: var(--muted); text-decoration: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 8px 14px; border: 1px solid var(--line-2);
    transition: background 0.18s, color 0.18s;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .nav-back:hover { background: var(--white); color: var(--teal-deep); }

  .wrap { position: relative; z-index: 2; max-width: 860px; margin: 0 auto; padding: 56px 24px 120px; }

  header {
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 20px; flex-wrap: wrap;
    padding-bottom: 22px; margin-bottom: 26px;
    border-bottom: 2px solid var(--white);
  }
  .section-num {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem; letter-spacing: 0.18em;
    color: var(--muted-dim); margin-bottom: 10px;
  }
  h1 {
    font-family: 'Anton', sans-serif; font-weight: 400;
    font-size: clamp(1.9rem, 3.6vw, 2.8rem);
    line-height: 1; margin: 0 0 8px;
    letter-spacing: 0.015em; text-transform: uppercase;
    color: var(--white);
  }
  header p {
    margin: 0; color: var(--muted); font-size: 0.92rem;
    max-width: 40ch;
  }
  .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .btn-primary {
    background: var(--white); color: var(--teal-deep);
    border: 1px solid var(--white);
    padding: 12px 22px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    cursor: pointer;
    transition: background 0.18s, color 0.18s;
    white-space: nowrap;
  }
  .btn-primary:hover { background: transparent; color: var(--white); }
  .btn-secondary {
    display: inline-flex; align-items: center; justify-content: center;
    text-decoration: none;
    background: transparent; color: var(--white);
    border: 1px solid var(--line-2);
    padding: 12px 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    transition: background 0.18s, color 0.18s, border-color 0.18s;
  }
  .btn-secondary:hover { background: var(--white); color: var(--teal-deep); border-color: var(--white); }

  .sync {
    color: var(--muted-dim); font-size: 0.72rem;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 20px;
  }

  .confirm-banner {
    display: none; padding: 13px 16px;
    font-size: 0.9rem; line-height: 1.55; margin-bottom: 22px;
    border: 1px solid transparent;
  }
  .confirm-banner.show { display: block; }
  .confirm-banner.ok    { background: var(--pos-bg); color: var(--pos); border-color: rgba(124,192,142,0.4); }
  .confirm-banner.error { background: var(--neg-bg); color: var(--neg); border-color: rgba(209,104,122,0.4); }

  .section-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.16em; color: var(--muted-dim);
    margin: 34px 0 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line-2);
  }
  .section-title:first-of-type { margin-top: 0; }

  /* CARDS */
  .card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--line-2);
    padding: 24px 24px 22px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .card:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: var(--white);
    transform: translateY(-1px);
  }
  .card.archived { opacity: 0.55; }
  .card.archived:hover { opacity: 0.85; }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .card-meta {
    font-size: 0.7rem; color: var(--muted-dim);
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .card-meta.secondary { margin-top: 6px; margin-bottom: 0; }
  .card-title {
    font-family: 'Anton', sans-serif; font-weight: 400;
    font-size: 1.32rem; margin: 0 0 8px;
    line-height: 1.18; letter-spacing: 0.015em;
    text-transform: uppercase; color: var(--white);
  }
  .card-excerpt {
    font-size: 0.92rem; color: rgba(255, 255, 255, 0.78);
    margin: 0; line-height: 1.6;
  }

  .badge {
    font-size: 0.62rem; padding: 4px 11px;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.16em; text-transform: uppercase;
    white-space: nowrap; font-weight: 500;
    border: 1px solid transparent;
  }
  .badge.active   { background: rgba(212,169,95,0.16); color: var(--gold); border-color: rgba(212,169,95,0.4); }
  .badge.accepted { background: var(--pos-bg); color: var(--pos); border-color: rgba(124,192,142,0.4); }
  .badge.rejected { background: var(--neg-bg); color: var(--neg); border-color: rgba(209,104,122,0.4); }

  .vote-bar {
    height: 6px; overflow: hidden; display: flex;
    margin-top: 16px; background: rgba(255, 255, 255, 0.08);
  }
  .vote-bar .za      { background: var(--pos); }
  .vote-bar .przeciw { background: var(--neg); }
  .vote-stats {
    display: flex; justify-content: space-between;
    margin-top: 8px;
    font-size: 0.7rem;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.06em;
  }
  .vote-stats .za-label      { color: var(--pos); }
  .vote-stats .przeciw-label { color: var(--neg); }
  .turnout {
    margin-top: 4px;
    font-size: 0.68rem;
    color: var(--muted-dim);
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .card-actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  .inline-vote {
    background: transparent;
    border: 1px solid var(--white);
    color: var(--white);
    padding: 9px 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase;
    cursor: pointer;
    transition: background 0.18s, color 0.18s;
  }
  .inline-vote:hover { background: var(--white); color: var(--teal-deep); }

  .empty {
    color: var(--muted-dim); padding: 30px 0;
    text-align: center; font-size: 0.85rem;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.1em; text-transform: uppercase;
  }

  /* MODALS */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(6, 10, 8, 0.65);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 30;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }

  .modal {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) translateY(8px);
    background: var(--paper); color: var(--paper-ink);
    width: min(580px, 92vw);
    max-height: 86vh; overflow-y: auto;
    padding: 40px 42px 32px;
    z-index: 31; opacity: 0; pointer-events: none;
    border: 1px solid rgba(0,0,0,0.1);
    box-shadow: 14px 14px 0 rgba(0, 0, 0, 0.35);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .modal::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--teal-deep);
  }
  #detailModal { width: min(820px, 94vw); }
  .modal.open {
    opacity: 1; pointer-events: auto;
    transform: translate(-50%, -50%) translateY(0);
  }
  .modal h2 {
    font-family: 'Anton', sans-serif; font-weight: 400;
    font-size: clamp(1.5rem, 2.6vw, 2rem);
    margin: 0 0 8px; padding-right: 30px;
    text-transform: uppercase; letter-spacing: 0.015em;
    line-height: 1.05; color: var(--teal-deep);
  }
  #detailModal h2 { font-size: clamp(1.7rem, 3vw, 2.3rem); }

  .modal .block-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem; text-transform: uppercase;
    letter-spacing: 0.16em; color: var(--paper-muted);
    margin: 22px 0 8px;
  }
  .modal .block-text {
    font-size: 0.96rem; line-height: 1.72;
    white-space: pre-wrap; margin: 0;
    color: var(--paper-ink);
  }
  #detailModal .block-text { font-size: 1rem; }

  .modal label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--teal-deep);
    margin: 16px 0 6px;
  }
  .modal input[type=text],
  .modal input[type=password],
  .modal textarea {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--paper-line);
    border-radius: 0;
    background: #fffdf7;
    font-family: 'Archivo', sans-serif;
    font-size: 15px; color: var(--paper-ink);
  }
  .modal textarea { min-height: 100px; resize: vertical; font-family: 'Archivo', sans-serif; }
  .modal input:focus, .modal textarea:focus { outline: none; border-color: var(--teal); }

  .vote-choice { display: flex; gap: 10px; margin: 20px 0; }
  .vote-choice button {
    flex: 1; padding: 14px;
    border: 1px solid var(--paper-line);
    background: #fffdf7;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.76rem; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .vote-choice button.za.selected {
    background: var(--pos-bg); border-color: var(--pos-dk); color: var(--pos-dk);
  }
  .vote-choice button.przeciw.selected {
    background: var(--neg-bg); border-color: var(--neg-dk); color: var(--neg-dk);
  }

  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .modal-actions button.confirm {
    flex: 1;
    background: var(--teal-deep); color: var(--paper);
    border: 1px solid var(--teal-deep);
    padding: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.74rem; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    cursor: pointer;
    transition: background 0.18s, color 0.18s;
  }
  .modal-actions button.confirm:hover { background: transparent; color: var(--teal-deep); }
  .modal-actions button.cancel {
    background: transparent;
    border: 1px solid var(--paper-line);
    color: var(--paper-ink);
    padding: 14px 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.74rem; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase;
    cursor: pointer;
  }
  .modal-actions button.cancel:hover { border-color: var(--paper-ink); }

  .modal-banner {
    font-size: 0.86rem; margin-top: 16px;
    padding: 12px 14px; display: none;
    border: 1px solid transparent;
  }
  .modal-banner.show  { display: block; }
  .modal-banner.error { background: rgba(164,70,80,0.12); color: var(--neg-dk); border-color: rgba(164,70,80,0.3); }
  .modal-banner.ok    { background: rgba(77,122,95,0.12); color: var(--pos-dk); border-color: rgba(77,122,95,0.3); }

  .close-x {
    position: absolute; top: 16px; right: 18px;
    background: none; border: none;
    font-size: 1.2rem; cursor: pointer;
    color: var(--paper-muted);
    font-family: 'Anton', sans-serif;
    line-height: 1;
    padding: 6px;
    transition: color 0.15s;
  }
  .close-x:hover { color: var(--teal-deep); }

  .votes-toggle {
    background: transparent;
    border: 1px solid var(--paper-line);
    color: var(--paper-muted);
    padding: 10px 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .votes-toggle:hover { border-color: var(--teal-deep); color: var(--teal-deep); }

  .votes-table {
    margin-top: 12px;
    border: 1px solid var(--paper-line);
    overflow: hidden;
  }
  .votes-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; padding: 10px 14px;
    font-size: 0.88rem;
    border-bottom: 1px solid var(--paper-line);
    background: rgba(255,255,255,0.3);
  }
  .votes-row:last-child { border-bottom: none; }
  .votes-row .v-login { flex: 1; font-weight: 500; }
  .votes-row .v-glos {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem; padding: 3px 9px;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .votes-row .v-glos.za      { background: var(--pos-bg); color: var(--pos-dk); }
  .votes-row .v-glos.przeciw { background: var(--neg-bg); color: var(--neg-dk); }
  .votes-row .v-waga {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--paper-muted);
    min-width: 80px; text-align: right;
    font-size: 0.82rem;
  }
  .votes-row .v-procent {
    font-family: 'IBM Plex Mono', monospace;
    min-width: 60px; text-align: right;
    font-size: 0.82rem;
  }

  @media (max-width: 640px) {
    .wrap { padding: 36px 16px 80px; }
    .card { padding: 20px 18px 18px; }
    header { align-items: flex-start; }
    .modal { padding: 32px 24px 24px; }
  }

  @media (max-width: 480px) {
    .nav-inner { padding: 10px 16px; gap: 10px; }
    .nav-brand { font-size: 0.94rem; letter-spacing: 0.12em; gap: 8px; }
    .nav-brand svg { width: 15px; height: 26px; }
    .nav-back {
      padding: 7px 11px;
      font-size: 0.64rem;
      letter-spacing: 0.12em;
    }
  }

  @media (max-width: 380px) {
    .nav-inner { padding: 10px 12px; gap: 8px; }
    .nav-back { padding: 6px 9px; font-size: 0.6rem; }
    .nav-brand { font-size: 0.88rem; letter-spacing: 0.1em; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="kbk-logo" viewBox="0 0 240 400">
      <rect x="111" y="0" width="18" height="400" fill="currentColor"/>
      <circle cx="72" cy="105" r="58" fill="none" stroke="currentColor" stroke-width="14"/>
      <circle cx="168" cy="105" r="58" fill="none" stroke="currentColor" stroke-width="14"/>
      <path d="M 129 248 L 192 248 L 158 272 L 192 296 L 158 320 L 192 344 L 158 368 L 192 392 L 192 400 L 129 400 Z" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand">
      <svg viewBox="0 0 240 400"><use href="#kbk-logo"/></svg>
      KBK
    </a>
    <a href="index.html" class="nav-back">← strona główna</a>
  </div>
</nav>

<div class="wrap">
  <header>
    <div>
      <span class="section-num">Moduł / 03</span>
      <h1>Wnioski</h1>
      <p>Przeglądaj, głosuj i składaj wnioski społeczności.</p>
    </div>
    <div class="header-actions">
      <button class="btn-primary" id="newProposalBtn">Złóż wniosek</button>
    </div>
  </header>

  <div class="sync" id="syncLabel">wczytywanie…</div>
  <div class="confirm-banner" id="confirmBanner"></div>

  <div id="proposalsContainer">
    <div class="section-title">Aktywne</div>
    <div id="activeList"></div>
    <div class="section-title">Archiwalne</div>
    <div id="archivedList"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<div class="modal" id="detailModal">
  <button class="close-x" data-close>✕</button>
  <div class="card-meta" id="detailAuthor"></div>
  <div class="card-meta secondary" id="detailRemaining"></div>
  <h2 id="detailTitle"></h2>
  <div id="detailBadge"></div>
  <div class="block-label">Treść</div>
  <p class="block-text" id="detailText"></p>
  <div class="block-label">Uzasadnienie</div>
  <p class="block-text" id="detailJustification"></p>
  <div class="vote-bar" id="detailBar"><div class="za"></div><div class="przeciw"></div></div>
  <div class="vote-stats" id="detailStats"></div>
  <div class="turnout" id="detailTurnout"></div>
  <div id="votesListSection" style="margin-top:16px;"></div>
  <div id="voteSection" style="margin-top:20px;"></div>
</div>

<div class="modal" id="voteModal">
  <button class="close-x" data-close>✕</button>
  <h2 id="voteModalTitle">Głosujesz nad wnioskiem</h2>
  <div class="vote-choice">
    <button type="button" class="za" data-choice="za">Za</button>
    <button type="button" class="przeciw" data-choice="przeciw">Przeciw</button>
  </div>
  <label>Login</label>
  <input type="text" id="voteLogin" autocomplete="off" style="text-transform:lowercase;">
  <label>PIN</label>
  <input type="password" id="votePin" maxlength="6" inputmode="numeric">
  <div class="modal-banner" id="voteBanner"></div>
  <div class="modal-actions">
    <button class="cancel" data-close>Anuluj</button>
    <button class="confirm" id="voteSubmitBtn">Wyślij głos</button>
  </div>
</div>

<div class="modal" id="proposalModal">
  <button class="close-x" data-close>✕</button>
  <h2>Nowy wniosek</h2>
  <label>Tytuł</label>
  <input type="text" id="proposalTytul" placeholder="Krótki, zwięzły tytuł">
  <label>Treść wniosku</label>
  <textarea id="proposalText" placeholder="Co dokładnie proponujesz?"></textarea>
  <label>Uzasadnienie</label>
  <textarea id="proposalJustification" placeholder="Dlaczego to warto zrobić?"></textarea>
  <label>Login</label>
  <input type="text" id="proposalLogin" autocomplete="off" style="text-transform:lowercase;">
  <label>PIN</label>
  <input type="password" id="proposalPin" maxlength="6" inputmode="numeric">
  <div class="modal-banner" id="proposalBanner"></div>
  <div class="modal-actions">
    <button class="cancel" data-close>Anuluj</button>
    <button class="confirm" id="proposalSubmitBtn">Złóż wniosek</button>
  </div>
</div>

<script>
  const APP_CONFIG = {
    webAppUrl: 'https://script.google.com/macros/s/AKfycbxTK2EwxVJ9rtnDEU2a7hmSC4Mzxyr2Dz60KYVqmeeBU1pudAEcOIZqSxOE8VICZZhvXg/exec'
  };
  const REFRESH_MS = 5 * 60 * 1000;
  const PROPOSALS_CACHE_MS = 15000;
  const SHEET_CACHE_MS = 600000;
  const sheetCache = {};

  let proposals = [];
  let proposalsCache = null;
  let proposalsCacheTs = 0;

  (function handleConfirmRedirect(){
    const params = new URLSearchParams(window.location.search);
    const confirmed = params.get('confirmed');
    if (!confirmed) return;
    const status = params.get('status');
    const banner = document.getElementById('confirmBanner');
    const messages = {
      'proposal-ok': ['Wniosek został aktywowany i pojawił się na liście aktywnych. Dziękujemy!', 'ok'],
      'proposal-invalid': ['Link jest nieprawidłowy albo wygasł. Złóż wniosek ponownie.', 'error'],
      'proposal-error': ['Wystąpił błąd. Spróbuj ponownie później.', 'error'],
      'vote-ok': ['Twój głos został potwierdzony. Dziękujemy za udział!', 'ok'],
      'vote-invalid': ['Link jest nieprawidłowy albo wygasł. Oddaj głos ponownie.', 'error'],
      'vote-notfound': ['Ten wniosek już nie istnieje.', 'error'],
      'vote-ended': ['Głosowanie na ten wniosek zostało już zakończone — Twój głos nie mógł zostać uwzględniony.', 'error'],
      'vote-error': ['Wystąpił błąd. Spróbuj ponownie później.', 'error']
    };
    const key = confirmed + '-' + status;
    const [text, type] = messages[key] || ['Nieznany status potwierdzenia.', 'error'];
    banner.textContent = text;
    banner.className = 'confirm-banner show ' + type;
    window.history.replaceState({}, document.title, window.location.pathname);
  })();

  let currentDetailId = null;
  let currentVoteChoice = null;

  function fmtDate(iso){
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('pl-PL');
  }
  function formatRemainingTime(endIso){
    if (!endIso) return '—';
    const diffMs = new Date(endIso).getTime() - Date.now();
    if (diffMs <= 0) return 'zakończone';
    const totalMinutes = Math.max(0, Math.floor(diffMs / 60000));
    const days = Math.floor(totalMinutes / (24 * 60));
    const hours = Math.floor((totalMinutes % (24 * 60)) / 60);
    const minutes = totalMinutes % 60;
    if (days > 0) return `${days}d ${hours}h ${minutes}m`;
    if (hours > 0) return `${hours}h ${minutes}m`;
    return `${minutes}m`;
  }
  function safeText(value, fallback = '') {
    if (value === null || value === undefined) return fallback;
    if (typeof value === 'string') return value.trim();
    if (typeof value === 'number' || typeof value === 'boolean') return String(value);
    try {
      const text = String(value).trim();
      return text === 'undefined' || text === 'null' ? fallback : text;
    } catch (e) {
      return fallback;
    }
  }
  function badgeHtml(status){
    const normalized = safeText(status);
    if (normalized === 'Aktywny')   return '<span class="badge active">aktywny</span>';
    if (normalized === 'Przyjęty')  return '<span class="badge accepted">przyjęty</span>';
    if (normalized === 'Odrzucony') return '<span class="badge rejected">odrzucony</span>';
    return '';
  }
  function escapeHtml(s){
    return String(safeText(s, '')).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function loadSheetJSONP(sheetId, sheetName) {
    const cacheKey = String(sheetId) + '|' + String(sheetName);
    const cached = sheetCache[cacheKey];
    if (cached && cached.expiresAt && Date.now() < cached.expiresAt && cached.table) {
      return Promise.resolve(cached.table);
    }
    if (cached && cached.promise) {
      return cached.promise;
    }

    const promise = new Promise(function (resolve, reject) {
      const cbName = 'gvizCb_' + sheetName.replace(/[^a-zA-Z0-9]/g, '') + '_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
      const url = 'https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq?tqx=out:json;responseHandler:' + cbName + '&sheet=' + encodeURIComponent(sheetName) + '&t=' + Date.now();
      const script = document.createElement('script');
      let settled = false;
      const cleanup = function () {
        try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      };
      const timer = setTimeout(function () {
        if (settled) return;
        settled = true; cleanup();
        delete sheetCache[cacheKey];
        reject(new Error('Przekroczono czas oczekiwania na arkusz "' + sheetName + '"'));
      }, 15000);
      window[cbName] = function (json) {
        if (settled) return;
        settled = true; clearTimeout(timer); cleanup();
        if (!json || !json.table) {
          delete sheetCache[cacheKey];
          reject(new Error('Nieprawidłowa odpowiedź dla arkusza "' + sheetName + '"'));
          return;
        }
        sheetCache[cacheKey] = { table: json.table, expiresAt: Date.now() + SHEET_CACHE_MS };
        resolve(json.table);
      };
      script.onerror = function () {
        if (settled) return;
        settled = true; clearTimeout(timer); cleanup();
        delete sheetCache[cacheKey];
        reject(new Error('Nie udało się załadować arkusza "' + sheetName + '"'));
      };
      script.src = url;
      document.head.appendChild(script);
    });

    sheetCache[cacheKey] = { promise: promise };
    return promise;
  }
  function cardHtml(p, archived){
    const safeTitle = safeText(p.tytul, '');
    const safeAutor = safeText(p.autor, '');
    const safeStatus = safeText(p.status, '');
    const safeTextContent = safeText(p.tresc, '');
    const excerpt = safeTextContent.length > 140 ? safeTextContent.slice(0, 140) + '…' : safeTextContent;
    const voteButton = safeStatus === 'Aktywny'
      ? `<div class="card-actions"><button class="inline-vote" type="button" data-vote-id="${safeText(p.id, '')}">Zagłosuj</button></div>`
      : '';
    const remainingText = safeStatus === 'Aktywny'
      ? `Pozostało: ${formatRemainingTime(safeText(p.dataWygasniecia, ''))}`
      : `Zakończono: ${fmtDate(safeText(p.dataWygasniecia, ''))}`;
    return `
    <div class="card ${archived ? 'archived' : ''}" data-id="${safeText(p.id, '')}">
      <div class="card-top">
        <div>
          <div class="card-meta">Zgłosił: ${escapeHtml(safeAutor)} · ${fmtDate(safeText(p.dataZlozenia, ''))}</div>
          <div class="card-meta secondary">${remainingText}</div>
          <h3 class="card-title">${escapeHtml(safeTitle)}</h3>
          <p class="card-excerpt">${escapeHtml(excerpt)}</p>
        </div>
        ${badgeHtml(safeStatus)}
      </div>
      <div class="vote-bar"><div class="za" style="width:${Number(p.procentZa) || 0}%"></div><div class="przeciw" style="width:${Number(p.procentPrzeciw) || 0}%"></div></div>
      <div class="vote-stats">
        <span class="za-label">za ${(Number(p.procentZa) || 0).toFixed(1)}%</span>
        <span class="przeciw-label">przeciw ${(Number(p.procentPrzeciw) || 0).toFixed(1)}%</span>
      </div>
      <div class="turnout">frekwencja: ${(Number(p.procentFrekwencji) || 0).toFixed(1)}% aktywnych RCR</div>
      ${voteButton}
    </div>`;
  }
  async function loadProposals(forceReload){
    const now = Date.now();
    if (!forceReload && proposalsCache && (now - proposalsCacheTs) < PROPOSALS_CACHE_MS) {
      proposals = proposalsCache; render();
      document.getElementById('syncLabel').textContent = 'zsynchronizowano ' + new Date().toLocaleTimeString('pl-PL');
      return;
    }
    document.getElementById('syncLabel').textContent = 'wczytywanie…';
    try{
      const config = await getPublicSheetConfig();
      const table = await loadSheetJSONP(config.wnioskiFileId, 'WNIOSKI');
      const rows = tableToObjects(table).map(function (row) {
        const id = strFromCell(lookupCell(row, ['ID', 'id'])) || '';
        const status = strFromCell(lookupCell(row, ['STATUS', 'status', 'Status'])) || '';
        const za = numFromCell(lookupCell(row, ['GŁOSÓW_ZA', 'GLOSOW_ZA', 'ZA', 'za']));
        const przeciw = numFromCell(lookupCell(row, ['GŁOSÓW_PRZECIW', 'GLOSOW_PRZECIW', 'PRZECIW', 'przeciw']));
        const activeRcr = numFromCell(lookupCell(row, ['SUMA_RCR_W_DNIU_WYGAŚNIĘCIA', 'SUMA_RCR', 'suma_rcr', 'RCR']));
        const totalForTurnout = status === 'Aktywny' ? activeRcr : activeRcr;
        const tytul = strFromCell(lookupCell(row, ['TYTUŁ', 'TYTUL', 'tytul', 'Tytuł']));
        const tresc = strFromCell(lookupCell(row, ['TREŚĆ', 'TRESC', 'tresc', 'Treść']));
        const uzasadnienie = strFromCell(lookupCell(row, ['UZASADNIENIE', 'uzasadnienie', 'Uzasadnienie']));
        const autor = strFromCell(lookupCell(row, ['LOGIN_AUTORA', 'LOGIN', 'login', 'Login']));
        const dataZlozenia = strFromCell(lookupCell(row, ['DATA_ZŁOŻENIA', 'DATA_ZLOZENIA', 'data_zlozenia', 'Data złożenia']));
        const dataWygasniecia = strFromCell(lookupCell(row, ['DATA_WYGAŚNIĘCIA', 'DATA_WYGASNIECIA', 'data_wygasniecia', 'Data wygasnięcia']));
        const suma = za + przeciw;
        const item = {
          id: id,
          tytul: tytul,
          tresc: tresc,
          uzasadnienie: uzasadnienie,
          autor: autor,
          dataZlozenia: dataZlozenia,
          dataWygasniecia: dataWygasniecia,
          status: status,
          glosowZa: za,
          glosowPrzeciw: przeciw,
          procentZa: suma > 0 ? (za / suma) * 100 : 0,
          procentPrzeciw: suma > 0 ? (przeciw / suma) * 100 : 0,
          procentFrekwencji: totalForTurnout > 0 ? (suma / totalForTurnout) * 100 : 0
        };
        if (!item.id || !status) return null;
        return item;
      }).filter(Boolean);
      proposals = rows;
      proposalsCache = proposals; proposalsCacheTs = Date.now();
      render();
      document.getElementById('syncLabel').textContent = 'zsynchronizowano ' + new Date().toLocaleTimeString('pl-PL');
    }catch(err){
      console.error(err);
      try {
        const res = await fetch(APP_CONFIG.webAppUrl + '?action=listProposals');
        const data = await res.json();
        proposals = data.proposals || [];
        proposalsCache = proposals; proposalsCacheTs = Date.now();
        render();
        document.getElementById('syncLabel').textContent = 'zsynchronizowano ' + new Date().toLocaleTimeString('pl-PL');
      } catch (fallbackErr) {
        console.error(fallbackErr);
        document.getElementById('syncLabel').textContent = 'błąd wczytywania danych';
      }
    }
  }
  function render(){
    const active = proposals.filter(p => p.status === 'Aktywny')
      .sort((a,b) => new Date(a.dataWygasniecia) - new Date(b.dataWygasniecia));
    const archived = proposals.filter(p => p.status === 'Przyjęty' || p.status === 'Odrzucony')
      .sort((a,b) => new Date(b.dataZlozenia) - new Date(a.dataZlozenia));
    document.getElementById('activeList').innerHTML = active.length
      ? active.map(p => cardHtml(p, false)).join('')
      : '<div class="empty">Brak aktywnych wniosków.</div>';
    document.getElementById('archivedList').innerHTML = archived.length
      ? archived.map(p => cardHtml(p, true)).join('')
      : '<div class="empty">Brak archiwalnych wniosków.</div>';
  }

  document.getElementById('proposalsContainer').addEventListener('click', (e) => {
    const voteBtn = e.target.closest('.inline-vote');
    if (voteBtn) { e.stopPropagation(); openVoteModal(voteBtn.dataset.voteId); return; }
    const card = e.target.closest('.card');
    if (card) openDetail(card.dataset.id);
  });

  function openDetail(id){
    const p = proposals.find(x => String(x.id) === String(id));
    if (!p) return;
    currentDetailId = id;
    document.getElementById('detailAuthor').textContent = 'Zgłosił: ' + safeText(p.autor, '') + ' · ' + fmtDate(safeText(p.dataZlozenia, ''));
    document.getElementById('detailRemaining').textContent = safeText(p.status, '') === 'Aktywny'
      ? 'Pozostało do zakończenia: ' + formatRemainingTime(safeText(p.dataWygasniecia, ''))
      : 'Zakończono: ' + fmtDate(safeText(p.dataWygasniecia, ''));
    document.getElementById('detailTitle').textContent = safeText(p.tytul, '');
    document.getElementById('detailBadge').innerHTML = badgeHtml(safeText(p.status, ''));
    document.getElementById('detailText').textContent = safeText(p.tresc, '');
    document.getElementById('detailJustification').textContent = safeText(p.uzasadnienie, '');
    document.getElementById('detailBar').innerHTML =
      `<div class="za" style="width:${Number(p.procentZa) || 0}%"></div><div class="przeciw" style="width:${Number(p.procentPrzeciw) || 0}%"></div>`;
    document.getElementById('detailStats').innerHTML =
      `<span class="za-label">za ${(Number(p.procentZa) || 0).toFixed(1)}%</span><span class="przeciw-label">przeciw ${(Number(p.procentPrzeciw) || 0).toFixed(1)}%</span>`;
    document.getElementById('detailTurnout').textContent =
      `frekwencja: ${(Number(p.procentFrekwencji) || 0).toFixed(1)}% aktywnych RCR` + (safeText(p.dataWygasniecia, '') ? ` · koniec: ${fmtDate(safeText(p.dataWygasniecia, ''))}` : '');

    const votesListSection = document.getElementById('votesListSection');
    const hasVotes = (p.glosowZa + p.glosowPrzeciw) > 0;
    votesListSection.innerHTML = hasVotes
      ? '<button class="votes-toggle" id="showVotesBtn">Zobacz listę głosów</button><div id="votesTable"></div>'
      : '';
    if (hasVotes) {
      document.getElementById('showVotesBtn').addEventListener('click', () => loadVotesList(id));
    }

    const voteSection = document.getElementById('voteSection');
    if (p.status === 'Aktywny') {
      voteSection.innerHTML = '<button class="btn-primary" id="openVoteBtn" style="width:100%;">Zagłosuj</button>';
      document.getElementById('openVoteBtn').addEventListener('click', () => openVoteModal(id));
    } else { voteSection.innerHTML = ''; }

    openModal('detailModal');
  }

  async function loadVotesList(wniosekId){
    const btn = document.getElementById('showVotesBtn');
    const table = document.getElementById('votesTable');
    btn.textContent = 'Wczytywanie…'; btn.disabled = true;
    try{
      const config = await getPublicSheetConfig();
      const sheet = await loadSheetJSONP(config.wnioskiFileId, 'GŁOSY');
      const rows = tableToObjects(sheet).filter(function (row) {
        const rowId = strFromCell(lookupCell(row, ['WNIOSEK_ID', 'WNIOSEKID', 'wniosekid', 'wniosekId']));
        return String(rowId).trim() === String(wniosekId).trim();
      }).map(function (row) {
        const login = strFromCell(lookupCell(row, ['LOGIN', 'login', 'Login']));
        const glos = strFromCell(lookupCell(row, ['GŁOS', 'GLOS', 'glos', 'Głos']));
        const waga = numFromCell(lookupCell(row, ['WAGA_RCR', 'WAGA', 'waga', 'waga_rcr']));
        return { login: login, glos: glos, waga: waga };
      });
      const total = rows.reduce(function (sum, vote) { return sum + vote.waga; }, 0);
      const votes = rows.map(function (vote) {
        return Object.assign({}, vote, { procent: total > 0 ? (vote.waga / total) * 100 : 0 });
      }).sort(function (a, b) { return b.waga - a.waga; });
      if (votes.length === 0) {
        table.innerHTML = '<div style="font-size:0.85rem;color:#7a6f4d;padding:10px 0;font-family:\'IBM Plex Mono\',monospace;">Brak potwierdzonych głosów.</div>';
      } else {
        table.innerHTML = '<div class="votes-table">' + votes.map(v => `
          <div class="votes-row">
            <span class="v-login">${escapeHtml(v.login)}</span>
            <span class="v-glos ${v.glos}">${v.glos}</span>
            <span class="v-waga">${Math.round(v.waga).toLocaleString('pl-PL')} RCR</span>
            <span class="v-procent">${v.procent.toFixed(1)}%</span>
          </div>`).join('') + '</div>';
      }
      btn.remove();
    }catch(err){
      console.error(err);
      try {
        const res = await fetch(APP_CONFIG.webAppUrl + '?action=listVotes&wniosekId=' + encodeURIComponent(wniosekId));
        const data = await res.json();
        const votes = data.votes || [];
        if (votes.length === 0) {
          table.innerHTML = '<div style="font-size:0.85rem;color:#7a6f4d;padding:10px 0;font-family:\'IBM Plex Mono\',monospace;">Brak potwierdzonych głosów.</div>';
        } else {
          table.innerHTML = '<div class="votes-table">' + votes.map(v => `
            <div class="votes-row">
              <span class="v-login">${escapeHtml(v.login)}</span>
              <span class="v-glos ${v.glos}">${v.glos}</span>
              <span class="v-waga">${Math.round(v.waga).toLocaleString('pl-PL')} RCR</span>
              <span class="v-procent">${v.procent.toFixed(1)}%</span>
            </div>`).join('') + '</div>';
        }
        btn.remove();
      } catch (fallbackErr) {
        console.error(fallbackErr);
        table.innerHTML = '<div style="font-size:0.85rem;color:#a44650;padding:10px 0;">Nie udało się wczytać listy głosów.</div>';
        btn.textContent = 'Zobacz listę głosów'; btn.disabled = false;
      }
    }
  }

  function openVoteModal(id){
    currentDetailId = id; currentVoteChoice = null;
    const proposal = proposals.find(x => String(x.id) === String(id));
    const title = proposal ? proposal.tytul : 'wnioskiem';
    document.getElementById('voteModalTitle').textContent = "Głosujesz nad wnioskiem: '" + title + "'";
    document.querySelectorAll('.vote-choice button').forEach(b => b.classList.remove('selected'));
    document.getElementById('voteLogin').value = '';
    document.getElementById('votePin').value = '';
    document.getElementById('voteBanner').className = 'modal-banner';
    openModal('voteModal');
  }

  document.querySelectorAll('.vote-choice button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentVoteChoice = btn.dataset.choice;
      document.querySelectorAll('.vote-choice button').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });

  document.getElementById('voteSubmitBtn').addEventListener('click', async () => {
    const banner = document.getElementById('voteBanner');
    banner.className = 'modal-banner';
    if (!currentVoteChoice) { banner.textContent = 'Wybierz "za" albo "przeciw".'; banner.className = 'modal-banner show error'; return; }
    const login = document.getElementById('voteLogin').value.trim().toLowerCase();
    const pin = document.getElementById('votePin').value.trim();
    if (!login || !/^\d{6}$/.test(pin)) { banner.textContent = 'Podaj login i 6-cyfrowy PIN.'; banner.className = 'modal-banner show error'; return; }
    const btn = document.getElementById('voteSubmitBtn');
    btn.disabled = true; btn.textContent = 'Wysyłanie…';
    try{
      const res = await fetch(APP_CONFIG.webAppUrl, {
        method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'castVote', login, pin, wniosekId: currentDetailId, glos: currentVoteChoice })
      });
      const data = await res.json();
      if (data.ok) {
        banner.textContent = 'Głos zapisany — sprawdź maila, żeby go potwierdzić.';
        banner.className = 'modal-banner show ok';
      } else {
        banner.textContent = data.message || 'Nie udało się oddać głosu.';
        banner.className = 'modal-banner show error';
      }
    }catch(err){
      banner.textContent = 'Błąd połączenia. Spróbuj ponownie.';
      banner.className = 'modal-banner show error';
    }finally{
      btn.disabled = false; btn.textContent = 'Wyślij głos';
    }
  });

  document.getElementById('newProposalBtn').addEventListener('click', () => {
    document.getElementById('proposalTytul').value = '';
    document.getElementById('proposalText').value = '';
    document.getElementById('proposalJustification').value = '';
    document.getElementById('proposalLogin').value = '';
    document.getElementById('proposalPin').value = '';
    document.getElementById('proposalBanner').className = 'modal-banner';
    openModal('proposalModal');
  });

  document.getElementById('proposalSubmitBtn').addEventListener('click', async () => {
    const banner = document.getElementById('proposalBanner');
    banner.className = 'modal-banner';
    const tytul = document.getElementById('proposalTytul').value.trim();
    const tresc = document.getElementById('proposalText').value.trim();
    const uzasadnienie = document.getElementById('proposalJustification').value.trim();
    const login = document.getElementById('proposalLogin').value.trim().toLowerCase();
    const pin = document.getElementById('proposalPin').value.trim();
    if (tytul.length < 5) { banner.textContent = 'Tytuł jest za krótki.'; banner.className='modal-banner show error'; return; }
    if (tresc.length < 10) { banner.textContent = 'Treść wniosku jest za krótka.'; banner.className='modal-banner show error'; return; }
    if (uzasadnienie.length < 10) { banner.textContent = 'Uzasadnienie jest za krótkie.'; banner.className='modal-banner show error'; return; }
    if (!login || !/^\d{6}$/.test(pin)) { banner.textContent = 'Podaj login i 6-cyfrowy PIN.'; banner.className='modal-banner show error'; return; }
    const btn = document.getElementById('proposalSubmitBtn');
    btn.disabled = true; btn.textContent = 'Wysyłanie…';
    try{
      const res = await fetch(APP_CONFIG.webAppUrl, {
        method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'submitProposal', login, pin, tytul, tresc, uzasadnienie })
      });
      const data = await res.json();
      if (data.ok) {
        banner.textContent = 'Wniosek zapisany — sprawdź maila, żeby go aktywować.';
        banner.className = 'modal-banner show ok';
      } else {
        banner.textContent = data.message || 'Nie udało się złożyć wniosku.';
        banner.className = 'modal-banner show error';
      }
    }catch(err){
      banner.textContent = 'Błąd połączenia. Spróbuj ponownie.';
      banner.className = 'modal-banner show error';
    }finally{
      btn.disabled = false; btn.textContent = 'Złóż wniosek';
    }
  });

  function openModal(id){
    document.querySelectorAll('.modal.open').forEach(m => { if (m.id !== id) m.classList.remove('open'); });
    document.getElementById('scrim').classList.add('open');
    document.getElementById(id).classList.add('open');
  }
  function closeModals(){
    document.getElementById('scrim').classList.remove('open');
    document.querySelectorAll('.modal').forEach(m => m.classList.remove('open'));
  }
  document.getElementById('scrim').addEventListener('click', closeModals);
  document.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeModals));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModals(); });

  loadProposals(true);
  setInterval(() => loadProposals(false), REFRESH_MS);
</script>
</body>
</html>
